name: Publish SPFx Solution

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Build solution
        run: gulp bundle --ship

      - name: Run unit tests
        run: npm test

      - name: Package solution
        run: gulp package-solution --ship

      - name: Install Office 365 CLI
        run: npm install -g @pnp/cli-microsoft365

      - name: Publish to SharePoint App Catalog
        env:
          M365_AUTH_CLIENT_ID: ${{ vars.M365_CLIENT_ID }}
          M365_AUTH_TENANT: ${{ vars.M365_TENANT }}
          M365_AUTH_CERTIFICATE: ${{ secrets.M365_CERTIFICATE }}
          M365_AUTH_CERTIFICATE_PASSWORD: ${{ secrets.M365_CERTIFICATE_PASSWORD }}
          M365_SITE_URL: ${{ vars.M365_SITE_URL }}
        run: |
          m365 login --appId ${{ vars.M365_CLIENT_ID }} --tenant ${{ vars.M365_TENANT }} --certificateBase64Encoded ${{ secrets.M365_CERTIFICATE }} --certificatePassword ${{ secrets.M365_CERTIFICATE_PASSWORD }}
          m365 spo app add --filePath ./sharepoint/solution/*.sppkg --appCatalogUrl ${{ vars.M365_SITE_URL }} --overwrite
          m365 spo app deploy --name $(ls ./sharepoint/solution/*.sppkg | xargs -n 1 basename) --appCatalogUrl ${{ vars.M365_SITE_URL }}
