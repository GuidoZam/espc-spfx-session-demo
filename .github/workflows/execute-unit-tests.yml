name: Execute unit tests

on:
  push:
    branches:
      - dev

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NodeVersion: 22.14.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NodeVersion }}

      - name: Install dependencies
        run: npm install

      - name: Build solution
        run: npm run build

      - name: Run unit tests
        run: npm test
